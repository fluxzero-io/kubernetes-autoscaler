name: Autoprovision Exoscale

on:
  push:
    branches:
      - autoprovision-exoscale
    tags:
      - v*
    paths:
      - 'cluster-autoscaler/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Docker metadata (tags, labels)
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: registry.fluxzero.io/cluster-autoscaler

      - name: Generate Fluxzero Cloud JWT
        id: jwt
        uses: fluxzero-io/fluxzero-jwt-action@v1
        with:
          api-key: ${{ secrets.FLUX_HOST_API_KEY }}

      - name: Log in to Fluxzero Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.fluxzero.io
          username: ${{ steps.jwt.outputs.userId }}
          password: ${{ steps.jwt.outputs.token }}

      - name: Build and push image to flux-host registry
        uses: docker/build-push-action@v5
        with:
          context: ./cluster-autoscaler
          file: ./cluster-autoscaler/Dockerfile
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
